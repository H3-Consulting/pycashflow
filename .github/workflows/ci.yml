name: CI

# Runs the web app test suite and a Docker build + smoke test on every pull
# request. iOS-only changes are skipped; the iOS app does not affect the web
# image or its tests.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "ios-app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the documented minimum for manual installs; 3.15 matches
        # the python:3.15-alpine base image used by the Dockerfile.
        python-version: ["3.11", "3.15"]
        # Every run covers PostgreSQL as well as SQLite: production deploys
        # use PostgreSQL, which enforces constraints SQLite ignores.
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pycashflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U test -d pycashflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # A plain postgresql:// URL, the form hosting providers hand out.
      TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://test:test@localhost:5432/pycashflow_test' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -c constraints.txt

      - name: Run tests
        run: python -m pytest -q --cov=app --cov-report=term-missing:skip-covered

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: pycashflow:ci
          build-args: DOCKER_TAG=ci-${{ github.sha }}
          cache-from: type=gha
          # The layer cache is only a speed-up; a GitHub cache service hiccup
          # ("failed to reserve cache") must not fail the build.
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Smoke test image (SQLite)
        run: .github/scripts/docker-smoke-test.sh pycashflow:ci "ci-${{ github.sha }}"

      - name: Smoke test image (PostgreSQL)
        env:
          SMOKE_DB: postgres
        run: .github/scripts/docker-smoke-test.sh pycashflow:ci "ci-${{ github.sha }}"
